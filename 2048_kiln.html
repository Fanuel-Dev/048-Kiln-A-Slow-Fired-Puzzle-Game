<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 — Kiln</title>
<style>
  :root{
    --clay-0: #f2e8da;
    --clay-1: #e7d7bf;
    --kiln: #b5573a;
    --kiln-dark: #8a3f28;
    --char: #2b241d;
    --char-soft: #6e6252;
    --glaze: #3f6e5e;

    --bg: #f2e8da;
    --board-bg: #cdb896;
    --cell-empty: rgba(43,36,29,0.08);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(181,87,58,0.08), transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(63,110,94,0.07), transparent 55%);
    font-family: 'Iowan Old Style', Georgia, 'Palatino Linotype', serif;
    color: var(--char);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 16px 50px;
    -webkit-user-select:none;
    user-select:none;
    touch-action: none;
  }

  header{
    width:100%;
    max-width: 440px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom: 18px;
  }

  .title-block .eyebrow{
    letter-spacing: 0.32em;
    text-transform: uppercase;
    font-size: 10.5px;
    color: var(--kiln);
    margin-bottom: 4px;
  }

  h1{
    margin:0;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--char);
  }
  h1 .zero{
    color: var(--kiln);
  }

  .scores{
    display:flex;
    gap: 8px;
  }
  .score-box{
    background: var(--board-bg);
    border-radius: 6px;
    padding: 8px 14px;
    text-align:center;
    min-width: 64px;
  }
  .score-box .label{
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(43,36,29,0.6);
    margin-bottom: 2px;
  }
  .score-box .value{
    font-size: 19px;
    font-weight: 700;
    color: var(--char);
  }

  .subrow{
    width:100%;
    max-width: 440px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--char-soft);
  }

  .subrow p{
    margin:0;
    max-width: 260px;
    line-height:1.4;
    font-style: italic;
  }

  .btn{
    padding: 9px 16px;
    border-radius: 5px;
    border: 1px solid var(--kiln-dark);
    background: var(--kiln);
    color: #f7efe1;
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease, background 0.12s ease;
    white-space: nowrap;
  }
  .btn:hover{ background: var(--kiln-dark); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }

  #board-wrap{
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1;
    background: var(--board-bg);
    border-radius: 10px;
    padding: 10px;
  }

  #grid-bg{
    position:absolute;
    inset: 10px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell-bg{
    background: var(--cell-empty);
    border-radius: 6px;
  }

  #tiles{
    position:absolute;
    inset: 10px;
  }

  .tile{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 6px;
    font-weight: 700;
    transition: top 0.12s ease, left 0.12s ease;
    animation: pop 0.15s ease;
  }

  @keyframes pop{
    0%{ transform: scale(0.6); opacity: 0.4; }
    100%{ transform: scale(1); opacity: 1; }
  }

  @keyframes merge-pop{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.18); }
    100%{ transform: scale(1); }
  }
  .tile.merged{ animation: merge-pop 0.18s ease; }

  /* Tile color progression: unglazed clay -> fired kiln -> glaze */
  .tile[data-val="2"]    { background:#e7d7bf; color:#5a4f3d; }
  .tile[data-val="4"]    { background:#dcc3a0; color:#4a3f2e; }
  .tile[data-val="8"]    { background:#d4a374; color:#3a2c1c; }
  .tile[data-val="16"]   { background:#c98a5a; color:#fbf3e6; }
  .tile[data-val="32"]   { background:#bf7345; color:#fbf3e6; }
  .tile[data-val="64"]   { background:var(--kiln); color:#fbf3e6; }
  .tile[data-val="128"]  { background:var(--kiln-dark); color:#fbf3e6; font-size: 0.9em; }
  .tile[data-val="256"]  { background:#6b3323; color:#fbf3e6; font-size: 0.9em; }
  .tile[data-val="512"]  { background:#4d6b52; color:#fbf3e6; font-size: 0.85em; }
  .tile[data-val="1024"] { background:var(--glaze); color:#fbf3e6; font-size: 0.75em; }
  .tile[data-val="2048"] { background:#2c4a3e; color:#f0d98c; font-size: 0.75em; box-shadow: 0 0 0 2px #f0d98c inset; }
  .tile[data-val="4096"],
  .tile[data-val="8192"] { background:#1f3129; color:#f0d98c; font-size: 0.7em; box-shadow: 0 0 0 2px #f0d98c inset; }

  #overlay{
    position:absolute;
    inset:0;
    background: rgba(242,232,218,0.88);
    border-radius: 10px;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px;
    gap: 10px;
  }
  #overlay.show{ display:flex; }
  #overlay .msg{
    font-size: 26px;
    font-weight:700;
    color: var(--char);
  }
  #overlay .sub{
    font-size: 13px;
    color: var(--char-soft);
    font-style: italic;
  }

  footer{
    margin-top: 22px;
    font-size: 11px;
    color: var(--char-soft);
    opacity:0.75;
    letter-spacing: 0.05em;
    text-align:center;
    max-width: 440px;
  }

  @media (max-width: 480px){
    h1{ font-size: 32px; }
    .subrow p{ display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <div class="eyebrow">A Slow-Fired Puzzle</div>
    <h1>20<span class="zero">4</span>8</h1>
  </div>
  <div class="scores">
    <div class="score-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
</header>

<div class="subrow">
  <p>Slide tiles to combine matching numbers. Reach 2048 before the kiln runs out of room.</p>
  <button class="btn" id="new-game">New Game</button>
</div>

<div id="board-wrap">
  <div id="grid-bg"></div>
  <div id="tiles"></div>
  <div id="overlay">
    <div class="msg" id="overlay-msg">Game Over</div>
    <div class="sub" id="overlay-sub">No more moves remain.</div>
    <button class="btn" id="overlay-retry">Try Again</button>
  </div>
</div>

<footer>ARROW KEYS OR SWIPE TO MOVE &middot; TILES OF EQUAL VALUE MERGE ON CONTACT</footer>

<script>
(function(){
  const SIZE = 4;
  const gridBg = document.getElementById('grid-bg');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlaySub = document.getElementById('overlay-sub');

  let board = [];
  let score = 0;
  let best = 0;
  let won = false;
  let gameOver = false;
  let tileIdCounter = 0;

  // Build static grid background cells
  for(let i = 0; i < SIZE * SIZE; i++){
    const c = document.createElement('div');
    c.className = 'cell-bg';
    gridBg.appendChild(c);
  }

  function emptyBoard(){
    return Array.from({length: SIZE}, () => Array(SIZE).fill(null));
  }

  function cellsOf(board){
    const cells = [];
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        if(!board[r][c]) cells.push([r, c]);
      }
    }
    return cells;
  }

  function addRandomTile(){
    const empties = cellsOf(board);
    if(empties.length === 0) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    const value = Math.random() < 0.9 ? 2 : 4;
    board[r][c] = { id: tileIdCounter++, value, r, c, isNew: true, merged: false };
  }

  function cloneBoardState(){
    return board.map(row => row.map(t => t ? {...t} : null));
  }

  function boardsEqual(a, b){
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        const av = a[r][c] ? a[r][c].value : 0;
        const bv = b[r][c] ? b[r][c].value : 0;
        if(av !== bv) return false;
      }
    }
    return true;
  }

  function resetNewFlags(){
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        if(board[r][c]){
          board[r][c].isNew = false;
          board[r][c].merged = false;
        }
      }
    }
  }

  function slideLine(line){
    // line: array of tile-or-null, length SIZE, moving toward index 0
    const filtered = line.filter(t => t !== null);
    const result = [];
    let gained = 0;
    let moved = false;

    for(let i = 0; i < filtered.length; i++){
      const cur = filtered[i];
      if(i < filtered.length - 1 && filtered[i + 1].value === cur.value && !cur.mergedAlready && !filtered[i+1].mergedAlready){
        const merged = {
          id: tileIdCounter++,
          value: cur.value * 2,
          merged: true,
          isNew: false
        };
        result.push(merged);
        gained += merged.value;
        i++; // skip next, it was consumed
      } else {
        result.push({ ...cur, merged: false, isNew: false });
      }
    }
    while(result.length < SIZE) result.push(null);

    return { result, gained };
  }

  function getColumn(b, c){
    return [b[0][c], b[1][c], b[2][c], b[3][c]];
  }
  function setColumn(b, c, col){
    for(let r = 0; r < SIZE; r++) b[r][c] = col[r];
  }

  function move(direction){
    if(gameOver) return;

    const prevBoard = cloneBoardState();
    let totalGained = 0;

    if(direction === 'left' || direction === 'right'){
      for(let r = 0; r < SIZE; r++){
        let line = board[r].slice();
        if(direction === 'right') line = line.reverse();
        const { result, gained } = slideLine(line);
        totalGained += gained;
        board[r] = direction === 'right' ? result.reverse() : result;
      }
    } else {
      for(let c = 0; c < SIZE; c++){
        let col = getColumn(board, c);
        if(direction === 'up') { /* already top-to-bottom = toward index 0 */ }
        if(direction === 'down') col = col.reverse();
        const { result, gained } = slideLine(col);
        totalGained += gained;
        setColumn(board, c, direction === 'down' ? result.reverse() : result);
      }
    }

    // reassign r,c for rendering
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        if(board[r][c]){
          board[r][c].r = r;
          board[r][c].c = c;
        }
      }
    }

    if(!boardsEqual(prevBoard, board)){
      score += totalGained;
      if(score > best){ best = score; }
      addRandomTile();
      render();
      checkWin();
      checkGameOver();
    }
  }

  function checkWin(){
    if(won) return;
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        if(board[r][c] && board[r][c].value >= 2048){
          won = true;
          showOverlay('You reached 2048!', 'Keep going for a higher score, or start fresh.', true);
          return;
        }
      }
    }
  }

  function canMove(){
    if(cellsOf(board).length > 0) return true;
    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        const v = board[r][c].value;
        if(c < SIZE - 1 && board[r][c+1].value === v) return true;
        if(r < SIZE - 1 && board[r+1][c].value === v) return true;
      }
    }
    return false;
  }

  function checkGameOver(){
    if(!canMove()){
      gameOver = true;
      showOverlay('Game Over', `No more moves remain. Final score: ${score}.`, false);
    }
  }

  function showOverlay(msg, sub, isWin){
    overlayMsg.textContent = msg;
    overlaySub.textContent = sub;
    overlay.classList.add('show');
  }

  function hideOverlay(){
    overlay.classList.remove('show');
  }

  function render(){
    scoreEl.textContent = score;
    bestEl.textContent = best;

    tilesEl.innerHTML = '';
    const wrapRect = document.getElementById('board-wrap').getBoundingClientRect();
    const innerSize = wrapRect.width - 20; // padding 10 each side
    const gap = 10;
    const cellSize = (innerSize - gap * (SIZE - 1)) / SIZE;

    for(let r = 0; r < SIZE; r++){
      for(let c = 0; c < SIZE; c++){
        const t = board[r][c];
        if(!t) continue;
        const el = document.createElement('div');
        el.className = 'tile' + (t.merged ? ' merged' : '');
        el.dataset.val = t.value > 8192 ? '8192' : t.value;
        el.textContent = t.value;
        el.style.width = cellSize + 'px';
        el.style.height = cellSize + 'px';
        el.style.top = (r * (cellSize + gap)) + 'px';
        el.style.left = (c * (cellSize + gap)) + 'px';
        el.style.fontSize = Math.max(16, cellSize * 0.42) + 'px';
        tilesEl.appendChild(el);
      }
    }
    resetNewFlags();
  }

  function newGame(){
    board = emptyBoard();
    score = 0;
    won = false;
    gameOver = false;
    hideOverlay();
    addRandomTile();
    addRandomTile();
    render();
  }

  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down'
    };
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // Touch / swipe controls
  let touchStartX = 0, touchStartY = 0;
  const boardWrap = document.getElementById('board-wrap');
  boardWrap.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });

  boardWrap.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 24;
    if(Math.max(absX, absY) < threshold) return;

    if(absX > absY){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('overlay-retry').addEventListener('click', newGame);

  window.addEventListener('resize', render);

  newGame();
})();
</script>
</body>
</html>
